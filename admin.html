<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comic Scheduler</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body class="admin-body"><section id="login-card" class="login-card"><h1>Comic Scheduler</h1><p>Sign in to upload and schedule comic pages.</p><label for="email">Email</label><input id="email" type="email"><label for="password" style="margin-top:12px">Password</label><input id="password" type="password"><button id="login" class="btn btn-primary" type="button">Sign In</button><div id="login-status" class="status"></div></section><main id="dashboard" class="admin-wrap hidden"><header class="admin-header"><div><h1>Weekly Comic Scheduler</h1><p>Every scheduled page releases at <strong>7:19 AM Mountain Time</strong>.</p></div><div><a class="btn" href="index.html" target="_blank">View Public Site</a> <button id="logout" class="btn btn-dark" type="button">Sign Out</button></div></header><section class="panel"><h2>Schedule Seven Days</h2><div class="grid-2"><div><label for="week-start">First release date</label><input id="week-start" type="date"></div><div><label for="default-banner">Default message for blank rows</label><input id="default-banner" type="text" placeholder="A new adventure has arrived."></div></div><div id="week-grid" class="week-grid" style="margin-top:18px"></div><button id="schedule-week" class="btn btn-primary" type="button" style="margin-top:18px">Upload and Schedule Week</button><div id="upload-status" class="status"></div></section><section class="panel"><h2>Scheduled and Published Pages</h2><div id="schedule-list" class="schedule-list"></div></section></main><script type="module" src="admin.js"></script></body></html>
